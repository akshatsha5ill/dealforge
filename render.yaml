services:
  # ------------------------------------------------------------
  # Backend Server (Node.js API)
  # ------------------------------------------------------------
  - type: web
    name: dealforge-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CLIENT_URL
        # Update this to your Vercel URL once deployed
        value: https://your-vercel-app-url.vercel.app 
